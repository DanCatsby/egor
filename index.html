<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подарок-сюрприз</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f9fa; /* Спокойный светлый фон вместо черного космоса */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1a1a1a;
        }

        /* Полноэкранная картинка */
        .fullscreen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .fullscreen-bg.visible {
            opacity: 1;
            z-index: 20;
        }

        /* Простой минималистичный интерфейс */
        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 24px;
        }

        .game-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px; /* Чуть более строгие углы */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); /* Едва заметная мягкая тень */
            border: 1px solid #e1e8ed;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }

        h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8899a6;
            margin-bottom: 15px;
        }

        .math-expr {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #1a1a1a;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            border-radius: 8px;
            border: 1px solid #ccd6dd;
            background: #ffffff;
            color: #1a1a1a;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #1da1f2; /* Спокойный синий фокус без свечения */
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background-color: #1a1a1a; /* Строгая матовая кнопка */
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover, button:active {
            background-color: #333333;
        }

        /* Простая анимация ошибки (просто красная рамка, без тряски) */
        .error-border {
            border-color: #e0245e !important;
        }

        /* Текст-подсказка */
        .final-text {
            font-size: 15px;
            font-weight: 500;
            color: #e0245e; /* Спокойный акцентный цвет */
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-overlay" id="game-screen">
        <div class="game-card">
            <h2 id="progress-text">Пример 1 из 5</h2>
            <div class="math-expr" id="question">...</div>
            <input type="number" id="answer-input" placeholder="Ответ" pattern="[0-9]*" inputmode="numeric">
            <button id="submit-btn">Готово</button>
            <div class="final-text" id="gift-text">Дорешай для подарка!</div>
        </div>
    </div>

    <img src="vas.jpg" alt="Сюрприз" class="fullscreen-bg" id="bg-img">

    <script>
        const allQuestions = [
            { text: "12 × 5", ans: 60 },
            { text: "150 - 45", ans: 105 },
            { text: "84 ÷ 4", ans: 21 },
            { text: "13 + 28", ans: 41 },
            { text: "9 × 8", ans: 72 },
            { text: "200 - 65", ans: 135 },
            { text: "60 ÷ 5", ans: 12 },
            { text: "37 + 14", ans: 51 }
        ];

        const shuffled = allQuestions.sort(() => 0.5 - Math.random());
        const gameQuestions = shuffled.slice(0, 5);

        let currentStep = 0;

        const questionEl = document.getElementById('question');
        const inputEl = document.getElementById('answer-input');
        const buttonEl = document.getElementById('submit-btn');
        const progressEl = document.getElementById('progress-text');
        const giftTextEl = document.getElementById('gift-text');
        const bgImg = document.getElementById('bg-img');

        function loadQuestion() {
            if (currentStep < gameQuestions.length) {
                progressEl.textContent = `Пример ${currentStep + 1} из 5`;
                questionEl.textContent = gameQuestions[currentStep].text;
                inputEl.value = '';
                inputEl.classList.remove('error-border');
                inputEl.focus();
                
                if (currentStep === gameQuestions.length - 1) {
                    giftTextEl.style.display = 'block';
                }
            }
        }

        function checkAnswer() {
            const userAnswer = parseInt(inputEl.value, 10);
            const correctAnswer = gameQuestions[currentStep].ans;

            if (userAnswer === correctAnswer) {
                currentStep++;
                if (currentStep < gameQuestions.length) {
                    loadQuestion();
                } else {
                    // Убираем форму и показываем картинку
                    document.getElementById('game-screen').style.display = 'none';
                    bgImg.classList.add('visible');
                }
            } else {
                inputEl.classList.add('error-border');
            }
        }

        buttonEl.addEventListener('click', checkAnswer);
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
        inputEl.addEventListener('input', () => {
            inputEl.classList.remove('error-border');
        });

        loadQuestion();
    </script>
</body>
</html>
