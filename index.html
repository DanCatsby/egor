<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Картинка со свайпом</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Полноэкранная картинка */
        .fullscreen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.8s ease; /* Плавное появление картинки */
        }

        /* Класс, который сделает картинку видимой */
        .fullscreen-bg.visible {
            opacity: 1;
        }

        /* Экран-заставка (шторка) */
        .swipe-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.9) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1); /* Плавное уезжание вверх */
            cursor: pointer;
            user-select: none;
        }

        /* Когда свайп сработал — поднимаем шторку вверх */
        .swipe-overlay.hidden {
            transform: translateY(-100%);
        }

        /* Текст подсказки */
        .swipe-text {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }

        /* Анимированная стрелочка вверх */
        .arrow {
            font-size: 32px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }
    </style>
</head>
<body>

    <!-- Заставка, которую нужно смахнуть -->
    <div class="swipe-overlay" id="overlay">
        <div class="arrow">▲</div>
        <div class="swipe-text">Проведи пальцем вверх</div>
    </div>

    <!-- Наша картинка -->
    <img src="vas.jpeg" alt="Фон" class="fullscreen-bg" id="bg-img">

    <script>
        const overlay = document.getElementById('overlay');
        const bgImg = document.getElementById('bg-img');
        
        let touchStartY = 0;
        let touchEndY = 0;

        // Отслеживаем начало касания
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        // Отслеживаем движение пальца и финал касания
        window.addEventListener('touchend', (e) => {
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });

        // Для ПК: обычный клик тоже откроет картинку
        overlay.addEventListener('click', () => {
            unlockSite();
        });

        // Функция проверки свайпа
        function handleSwipe() {
            // Если палец переместился снизу вверх больше чем на 50 пикселей
            if (touchStartY - touchEndY > 50) {
                unlockSite();
            }
        }

        // Функция открытия картинки
        function unlockSite() {
            overlay.classList.add('hidden'); // Убираем шторку наверх
            bgImg.classList.add('visible');  // Плавно проявляем картинку
        }
    </script>
</body>
</html>
